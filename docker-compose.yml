# Kafka local para desarrollo: un solo contenedor "broker" en modo KRaft
# (sin ZooKeeper: el propio Kafka hace de controlador).
#
#   docker compose up -d          arrancar
#   bash scripts/crear_topics.sh  crear los 5 topics (solo la primera vez)
#   docker compose down           parar
#
# Para que se conecten otros PCs del laboratorio, cambiad "localhost" en
# KAFKA_ADVERTISED_LISTENERS por la IP de este PC (ipconfig) y reiniciad.
services:
  broker:
    image: apache/kafka:3.9.1
    container_name: broker              # los comandos usan "docker exec broker ..."
    ports:
      - "9092:9092"                     # puerto de los clientes (Engine, FO, CENTRAL)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller        # KRaft: un nodo hace las dos cosas
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # Dirección que Kafka da a los clientes para que vuelvan a conectarse a él.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # Con un solo broker no puede haber más de 1 réplica de nada.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Los consumidores reciben particiones al momento (por defecto espera 3 s).
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
